<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zephyr Architecture</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f5f5f5;
    color:#10263d;
}

/* NAVIGATION */

header{
    background:#061d33;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    color:white;
    font-size:20px;
    font-weight:bold;
}

.logo span{
    color:#d2a85b;
}

nav{
    display:flex;
    gap:10px;
}

nav a{
    color:white;
    text-decoration:none;
    padding:10px 15px;
    font-weight:bold;
    border-radius:5px;
}

nav a:hover{
    background:#d2a85b;
    color:#061d33;
}

/* HOME */

#home{
    min-height:80vh;
    display:flex;
    align-items:center;
    padding:50px 8%;
    background:#061d33;
    color:white;
}

.home-content{
    max-width:700px;
}

.home-content h1{
    font-size:55px;
    margin-bottom:20px;
}

.home-content h1 span{
    color:#d2a85b;
}

.home-content p{
    font-size:18px;
    line-height:1.7;
    margin-bottom:30px;
}

.button{
    display:inline-block;
    background:#d2a85b;
    color:#061d33;
    padding:14px 25px;
    text-decoration:none;
    font-weight:bold;
    border-radius:5px;
}

/* PRODUCTS */

#products{
    padding:70px 7%;
    background:white;
}

.title{
    text-align:center;
    margin-bottom:40px;
}

.title h2{
    font-size:40px;
    margin-bottom:10px;
}

.title p{
    color:#666;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
}

.product{
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,0.15);
}

.product img{
    width:100%;
    height:230px;
    object-fit:cover;
    display:block;
}

.product-info{
    padding:20px;
}

.product-info h3{
    margin-bottom:10px;
}

.product-info p{
    color:#666;
    line-height:1.5;
}

/* MOBILE */

@media(max-width:650px){

    header{
        flex-direction:column;
        gap:15px;
    }

    nav a{
        padding:8px;
        font-size:12px;
    }

    .home-content h1{
        font-size:40px;
    }

}

</style>
</head>

<body>

<header>

<div class="logo">
ZEPHYR <span>ARCHITECTURE</span>
</div>

<nav>
<a href="#home">HOME</a>
<a href="#products">PRODUCTS</a>
</nav>

</header>


<section id="home">

<div class="home-content">

<h1>
Designing Spaces,<br>
<span>Creating Lifestyles.</span>
</h1>

<p>
Welcome to Zephyr Architecture. Explore modern,
functional and beautifully designed architectural
plans and house designs.
</p>

<a href="#products" class="button">
VIEW PRODUCTS
</a>

</div>

</section>


<section id="products">

<div class="title">

<h2>Our Products</h2>

<p>
Explore our architectural designs and floor plans.
</p>

</div>


<div class="products">

<!-- PRODUCTS WILL BE ADDED HERE -->

</div>

</section>

</body>
</html>
