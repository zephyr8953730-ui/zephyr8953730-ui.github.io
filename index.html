<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat App - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #6c63ff, #4facfe);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 400px;
      background: white;
      border-radius: 25px;
      padding: 30px 25px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
    }

    .logo {
      width: 75px;
      height: 75px;
      margin: 0 auto 15px;
      background: #6c63ff;
      color: white;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 35px;
    }

    h1 {
      text-align: center;
      color: #222;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    .tabs {
      display: flex;
      background: #f1f1f1;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 25px;
    }

    .tabs button {
      width: 50%;
      border: none;
      padding: 12px;
      border-radius: 9px;
      background: transparent;
      cursor: pointer;
      font-size: 15px;
    }

    .tabs button.active {
      background: white;
      color: #6c63ff;
      font-weight: bold;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .input-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #444;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #6c63ff;
    }

    .forgot {
      text-align: right;
      margin-bottom: 20px;
    }

    .forgot a {
      color: #6c63ff;
      text-decoration: none;
      font-size: 13px;
    }

    .main-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #6c63ff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .main-btn:active {
      transform: scale(0.98);
    }

    .or {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 22px 0;
      color: #999;
      font-size: 13px;
    }

    .or::before,
    .or::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #ddd;
    }

    .google-btn {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: white;
      cursor: pointer;
      font-size: 15px;
    }

    .terms {
      text-align: center;
      color: #888;
      font-size: 12px;
      margin-top: 20px;
      line-height: 1.5;
    }

    .signup-fields {
      display: none;
    }

    @media (max-width: 420px) {
      .container {
        padding: 25px 20px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">💬</div>

    <h1>Welcome</h1>
    <p class="subtitle">Connect and chat with your friends</p>

    <div class="tabs">
      <button id="loginTab" class="active" onclick="showLogin()">Login</button>
      <button id="signupTab" onclick="showSignup()">Sign Up</button>
    </div>

    <!-- LOGIN -->
    <form id="loginForm">

      <div class="input-group">
        <label>Email or Username</label>
        <input type="text" placeholder="Enter your email or username" required>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" placeholder="Enter your password" required>
      </div>

      <div class="forgot">
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit" class="main-btn">
        Login
      </button>

    </form>

    <!-- SIGN UP -->
    <form id="signupForm" class="signup-fields">

      <div class="input-group">
        <label>Username</label>
        <input type="text" placeholder="Choose a username" required>
      </div>

      <div class="input-group">
        <label>Email</label>
        <input type="email" placeholder="Enter your email" required>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" placeholder="Create a password" required>
      </div>

      <div class="input-group">
        <label>Confirm Password</label>
        <input type="password" placeholder="Confirm your password" required>
      </div>

      <button type="submit" class="main-btn">
        Create Account
      </button>

    </form>

    <div class="or">
      OR
    </div>

    <button class="google-btn">
      Continue with Google
    </button>

    <p class="terms">
      By continuing, you agree to our Terms of Service
      and Privacy Policy.
    </p>

  </div>

  <script>

    function showLogin() {
      document.getElementById("loginForm").style.display = "block";
      document.getElementById("signupForm").style.display = "none";

      document.getElementById("loginTab").classList.add("active");
      document.getElementById("signupTab").classList.remove("active");
    }

    function showSignup() {
      document.getElementById("loginForm").style.display = "none";
      document.getElementById("signupForm").style.display = "block";

      document.getElementById("loginTab").classList.remove("active");
      document.getElementById("signupTab").classList.add("active");
    }

    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      alert("Login system will be connected to the database next.");
    });

    document.getElementById("signupForm").addEventListener("submit", function(e) {
      e.preventDefault();
      alert("Account creation will be connected to the database next.");
    });

  </script>

</body>
</html>
